# What free-router writes into a DeepSeek Harness cordis.patch.yml (under llm-pi-ai → providers).
# You don't need to add this by hand when FR_DSH_PATCHES is set — shown for reference and for other OpenAI-compatible clients.
- id: llm-pi-ai
  config:
    providers:
      free-auto:
        displayName: "Free OpenRouter (auto)"
        api: openai-completions
        baseURL: "http://127.0.0.1:11500/v1"
        apiKeyEnv: FREE_ROUTER_KEY     # any non-empty value, e.g. FREE_ROUTER_KEY=local in ~/.dsh/.env
        timeoutMs: 600000
        models:
          - id: "auto"
            name: "Auto: best available free model"
            contextWindow: 128000
            maxTokens: 8192
# Optional: make it the default model
- id: agent-default-model
  config:
    provider: free-auto
    model: auto
